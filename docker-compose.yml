# ╔══════════════════════════════════════════════════════╗
# ║  MIazAI Edge Node — Docker Compose Stack             ║
# ║  Host: miazai-edge (T420 Ubuntu 24.04)               ║
# ║  Services: Redis · Qdrant · Neo4j                    ║
# ╚══════════════════════════════════════════════════════╝

version: '3.8'

services:

  redis:
    image: redis:7-alpine
    container_name: miazai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: miazai-qdrant
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5.18-community
    container_name: miazai-neo4j
    environment:
      - NEO4J_AUTH=neo4j/miazai2026
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_data:
  neo4j_data:

# Usage:
#   docker compose up -d          → start all services
#   docker compose ps             → check status
#   docker compose down           → stop (data preserved in volumes)
#   docker compose down -v        → stop + WIPE all data (destructive!)
